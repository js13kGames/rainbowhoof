<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffc9e6">
<meta name="description" content="Rainbowhoof - drag to paint rainbow bridges and gallop a tiny unicorn across the dusk hills. A js13kGames 2026 entry.">
<title>Rainbowhoof</title>
<!-- 内联 favicon：既省一次请求，也避免托管环境返回 404 -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>&#127752;</text></svg>">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:100%;height:100%;overflow:hidden;
    /* 首帧前的底色：与天空渐变底端一致，加载时不会有黑闪 */
    background:#2b1442 linear-gradient(180deg,#63b8f2 0%,#e7d3fb 62%,#ffc9e6 86%,#ffe7c4 100%);
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    overscroll-behavior:none;touch-action:none;
    font-family:"Century Gothic","Futura","Trebuchet MS",sans-serif;
  }
  #game{
    position:fixed;inset:0;width:100%;height:100%;display:block;
    touch-action:none;cursor:crosshair;
  }
  noscript p{
    position:fixed;inset:0;display:grid;place-items:center;
    color:#fff;font-size:18px;text-align:center;padding:24px;
    background:rgba(43,20,66,.82);
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<noscript><p>Rainbowhoof needs JavaScript to run.<br>Please enable it and reload.</p></noscript>
<!--SCRIPT-->
<script type="module" src="src/main.js"></script>
</body>
</html>
