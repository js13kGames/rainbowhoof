<script>(() => {
  // src/lib.js
  var {
    sin,
    cos,
    tan,
    abs,
    max,
    min,
    floor,
    ceil,
    round,
    sqrt,
    pow,
    atan2,
    random,
    hypot,
    sign,
    PI

  var TAU = PI * 2;
  var clamp = (v, a, b) => v < a ? a : v > b ? b : v;

    h = (h ^ h >> 13) * 1274126177;
    return ((h ^ h >> 16) >>> 0) / 4294967296;

  // src/world.js
  var STEP = 26;
  var BASE_Y = 470;
  var Y_MIN = BASE_Y - 220;
  var Y_MAX = BASE_Y + 150;
  var SPIKE_W = 22;
  var SPIKE_H = 26;
  var DUST_R = 30;
  var W = {

    // 生成游标：当前地面高度

    hillT: 0,

    hillRate: 0.08,

    modeLeft: 0,
    voidDust: false,

    nextDustX: 0,

    // 下一根尖刺的世界 x

  function reset(attract) {

    W.dust.length = 0;
    W.fx.length = 0;
    W.gy = W.lastY = W.cam.gy = BASE_Y;
    W.hillT = 0;
    W.hillAmp = 16;
    W.hillRate = 0.08;
    W.mode = "solid";
    W.modeLeft = 60;
    W.voidDust = false;
    W.dist = 0;
    W.time = 0;
    W.startX = 120;
    W.genCol = floor((W.startX - 620) / STEP);
    W.pruneCol = W.genCol;
    W.nextDustX = W.startX + 300;
    W.nextSpikeX = W.startX + 1700;
    genTo(W.startX + 1600);
    const c = W.cam;
    c.x = W.startX - viewW() * 0.32;
    c.y = BASE_Y - viewH() * 0.52;

  function resize(w, h) {
    const c = W.cam;

  }
  var viewW = () => W.cam.w / W.cam.zoom;
  var viewH = () => W.cam.h / W.cam.zoom;
  var difficulty = () => clamp(W.dist / 9e3, 0, 1);
  function planMode() {
    const diff = difficulty();
    if (W.mode === "void") {
      W.mode = "solid";
      W.modeLeft = rngi(11, 24);
      W.hillAmp = rng(10, 28) * (0.6 + diff * 0.8);
      W.hillRate = rng(0.045, 0.13);
      if (random() < 0.3) W.gy = clamp(W.gy + rng(-46, 40), Y_MIN, Y_MAX);
    } else if (!W.attract && random() < 0.1 + diff * 0.52) {
      W.mode = "void";
      W.modeLeft = rngi(4, 5 + floor(diff * 7));
      W.voidDust = false;
    } else {
      W.modeLeft = rngi(8, 20);
      W.hillAmp = rng(8, 30) * (0.6 + diff * 0.8);
      W.hillRate = rng(0.04, 0.14);
    }
  }
  function genTo(xTarget) {
    const colTarget = ceil(xTarget / STEP);
    let nextDust = W.nextDustX, nextSpike = W.nextSpikeX;
    while (W.genCol <= colTarget) {
      if (W.modeLeft <= 0) planMode();

        W.ground.set(W.genCol, NaN);
        if (!W.voidDust && W.modeLeft <= 2) {

          nextDust = x + rng(260, 420);

      } else {

        W.gy = clamp(W.gy + sin(W.hillT) * W.hillAmp * 0.42, Y_MIN, Y_MAX);
        W.ground.set(W.genCol, W.gy);
        W.lastY = W.gy;

        }
      }
      if (x > nextDust) {
        const base = W.mode === "void" ? W.lastY : W.gy;
        W.dust.push({ x: x + STEP / 2, y: base - rng(46, 140), ph: random() * TAU, taken: false });
        nextDust = x + rng(200, 400);

      W.genCol++;

    W.nextSpikeX = nextSpike;
  }
  function ginfo(x) {
    const f = x / STEP, i = floor(f), t = f - i;

  }
  function collectDust(x, y, r) {
    const got = [];
    for (const d of W.dust) {

      const dx = d.x - x, dy = d.y - y;
      if (dx * dx + dy * dy < (r + DUST_R) * (r + DUST_R)) {
        d.taken = true;
        got.push(d);
      }

    return got;
  }
  function hitSpike(x, y, r) {
    for (const s of W.spikes) {

      if (y + r > s.y - SPIKE_H * 0.55 && y - r < s.y && abs(s.x - x) < SPIKE_W * 0.62 + r * 0.5) return s;
    }
    return null;
  }
  function burst(kind, x, y, n, vx0, vy0) {
    for (let i = 0; i < n; i++) {
      const a = random() * TAU, sp = rng(20, kind === "boom" ? 260 : 120);
      W.fx.push({
        kind,
        x,
        y,
        vx: cos(a) * sp + (vx0 || 0),
        vy: sin(a) * sp + (vy0 || 0),
        life: 0,
        max: rng(0.28, kind === "boom" ? 1.1 : 0.7),
        size: rng(1.6, kind === "star" ? 5.5 : 4),
        hue: random() * 360 | 0
      });
    }
  }
  function update(dt, ux, uy) {
    W.time += dt;
    W.dist = max(W.dist, ux - W.startX);
    genTo(ux + viewW() * 1.6);
    const c = W.cam, vw = viewW(), vh = viewH();
    const gi = ginfo(clamp(ux + 60, c.x, c.x + vw));
    if (gi) c.gy = damp(c.gy, gi.y, 6, dt);
    c.x = damp(c.x, ux - vw * 0.32, 9, dt);
    const focusY = clamp(uy, c.gy - 260, c.gy + 130);
    c.y = damp(c.y, focusY - vh * 0.52, 5.5, dt);
    for (let i = W.fx.length - 1; i >= 0; i--) {
      const p = W.fx[i];
      p.life += dt;
      if (p.life >= p.max) {
        W.fx.splice(i, 1);
        continue;
      }
      p.vy += (p.kind === "spark" ? 220 : 780) * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.kind === "dust" || p.kind === "boom") p.vx *= 1 - 1.8 * dt;
    }
    const pruneX = c.x - vw;
    while (W.dust.length && W.dust[0].x < pruneX) W.dust.shift();
    while (W.spikes.length && W.spikes[0].x < pruneX) W.spikes.shift();
    const pc = floor(pruneX / STEP) - 4;
    while (W.pruneCol < pc) {
      W.ground.delete(W.pruneCol++);
    }
  }
  var deathY = () => W.cam.y + viewH() + 40;
  var wx = (px) => px / W.cam.zoom + W.cam.x;
  var wy = (py) => py / W.cam.zoom + W.cam.y;

  // src/rainbow.js
  var INK_MAX = 100;
  var INK_REGEN = 5;
  var INK_PER_PX = 0.22;
  var ARC_LIFE = 4.6;
  var ARC_FADE = 1.1;
  var ARC_MAX = 7;
  var MIN_SEG = 9;
  var MIN_LEN = 26;
  var CATCH = 15;
  var RB = {
    arcs: [],
    // 已成形的弧
    cur: null,
    // 正在绘制的弧：{p:[x,y,...], len}
    ink: INK_MAX,
    drawing: false,
    painted: 0,
    // 本局画出的总弧长
    blocked: 0,
    // 墨尽提示计时（UI 闪红）
    gain: 0
    // 星尘回墨的瞬间反馈计时
  };
  function reset2() {
    RB.arcs.length = 0;
    RB.cur = null;
    RB.ink = INK_MAX;
    RB.drawing = false;
    RB.painted = 0;
    RB.blocked = 0;
    RB.gain = 0;
  }
  function down(x, y) {
    if (RB.ink < 1) {
      RB.blocked = 0.4;
      return;
    }
    RB.drawing = true;
    RB.cur = { p: [x, y], len: 0 };
  }
  function move(x, y) {
    const c = RB.cur;
    if (!RB.drawing || !c) return false;
    const p = c.p, n = p.length;
    const dx = x - p[n - 2], dy = y - p[n - 1];
    const d = sqrt(dx * dx + dy * dy);
    if (d < MIN_SEG) return false;
    const cost = d * INK_PER_PX;
    if (RB.ink < cost) {
      const k = RB.ink / cost;
      if (k > 0.15) {
        p.push(p[n - 2] + dx * k, p[n - 1] + dy * k);
        c.len += d * k;
        RB.ink = 0;
      }
      RB.blocked = 0.45;
      up();
      return false;
    }
    p.push(x, y);
    c.len += d;
    RB.ink -= cost;
    return true;
  }
  function up() {
    RB.drawing = false;
    const c = RB.cur;
    RB.cur = null;
    if (!c) return null;
    let p = smooth(c.p);
    let len = polyLen(p);
    if (p.length < 4 || len < MIN_LEN) {
      RB.ink = min(INK_MAX, RB.ink + len * INK_PER_PX);
      return null;
    }
    if (p[p.length - 2] < p[0]) {
      const q = new Array(p.length);
      for (let i = 0; i < p.length; i += 2) {
        q[p.length - 2 - i] = p[i];
        q[p.length - 1 - i] = p[i + 1];
      }
      p = q;
    }
    const cum = [0];
    for (let i = 2; i < p.length; i += 2) {
      const dx = p[i] - p[i - 2], dy = p[i + 1] - p[i - 1];
      cum.push(cum[i / 2 - 1] + sqrt(dx * dx + dy * dy));
    }
    const arc = { p, cum, hint: 0, age: 0, len, x0: 1e9, x1: -1e9, y0: 1e9, y1: -1e9 };
    for (let i = 0; i < p.length; i += 2) {
      arc.x0 = min(arc.x0, p[i]);
      arc.x1 = max(arc.x1, p[i]);
      arc.y0 = min(arc.y0, p[i + 1]);
      arc.y1 = max(arc.y1, p[i + 1]);
    }
    RB.painted += len;
    RB.arcs.push(arc);
    if (RB.arcs.length > ARC_MAX) RB.arcs.shift();
    return arc;
  }
  function smooth(src) {
    if (src.length < 6) return src.slice();
    const o = [src[0], src[1]];
    for (let i = 0; i < src.length - 3; i += 2) {
      const x0 = src[i], y0 = src[i + 1], x1 = src[i + 2], y1 = src[i + 3];
      o.push(
        x0 * 0.72 + x1 * 0.28,
        y0 * 0.72 + y1 * 0.28,
        x0 * 0.28 + x1 * 0.72,
        y0 * 0.28 + y1 * 0.72
      );
    }
    o.push(src[src.length - 2], src[src.length - 1]);
    const r = [o[0], o[1]];
    for (let i = 2; i < o.length - 2; i += 2) {
      const dx = o[i] - r[r.length - 2], dy = o[i + 1] - r[r.length - 1];
      if (dx * dx + dy * dy >= 121) r.push(o[i], o[i + 1]);
    }
    r.push(o[o.length - 2], o[o.length - 1]);
    return r;
  }
  function polyLen(p) {
    let L = 0;
    for (let i = 2; i < p.length; i += 2) {
      const dx = p[i] - p[i - 2], dy = p[i + 1] - p[i - 1];
      L += sqrt(dx * dx + dy * dy);
    }
    return L;
  }
  function update2(dt) {
    RB.ink = min(INK_MAX, RB.ink + INK_REGEN * dt);
    if (RB.blocked > 0) RB.blocked -= dt;
    if (RB.gain > 0) RB.gain -= dt;
    for (let i = RB.arcs.length - 1; i >= 0; i--) {
      RB.arcs[i].age += dt;
      if (RB.arcs[i].age >= ARC_LIFE) RB.arcs.splice(i, 1);
    }
  }
  function alpha(a) {
    const inA = min(1, a.age / 0.12);
    const left = ARC_LIFE - a.age;
    return inA * (left < ARC_FADE ? max(0, left / ARC_FADE) : 1);
  }
  function addInk(v) {
    RB.ink = min(INK_MAX, RB.ink + v);
    RB.gain = 0.35;
  }
  function surfAt(x, py, y, vy) {
    let best = null;
    for (let k = RB.arcs.length - 1; k >= 0; k--) {
      const a = RB.arcs[k], p = a.p, cum = a.cum;
      if (x < a.x0 - 2 || x > a.x1 + 2) continue;
      if (alpha(a) <= 0.03) continue;
      for (let i = 0; i + 1 < cum.length; i++) {
        const ax = p[2 * i], bx = p[2 * i + 2];
        const lo = min(ax, bx), hi = max(ax, bx);
        if (x < lo || x > hi || hi - lo < 1e-6) continue;
        const t = (x - ax) / (bx - ax);
        const ay = p[2 * i + 1], by = p[2 * i + 3];
        const hy = ay + (by - ay) * t;
        if (py > hy + 2) continue;
        if (y < hy - CATCH) continue;
        if (vy < -40 && y < hy - 2) continue;
        if (best && hy >= best.y) continue;
        let tx = bx - ax, ty = by - ay;
        const L = sqrt(tx * tx + ty * ty) || 1;
        tx /= L;
        ty /= L;
        if (tx < 0) {
          tx = -tx;
          ty = -ty;
        }
        best = { arc: a, y: hy, tx, ty, d: cum[i] + (cum[i + 1] - cum[i]) * t };
      }

  }
  function pointAt(a, d) {
    const cum = a.cum, n = cum.length, p = a.p;
    if (!(d >= 0) || d >= cum[n - 1]) return null;
    let i = a.hint;
    if (i > n - 2) i = n - 2;
    while (i > 0 && cum[i] > d) i--;
    while (i < n - 2 && cum[i + 1] <= d) i++;

    const seg = cum[i + 1] - cum[i] || 1;
    const t = (d - cum[i]) / seg;
    const x0 = p[2 * i], y0 = p[2 * i + 1], x1 = p[2 * i + 2], y1 = p[2 * i + 3];
    let tx = x1 - x0, ty = y1 - y0;
    const L = sqrt(tx * tx + ty * ty) || 1;

    ty /= L;

      ty = -ty;
    }

      if (ux < 0) {
        ux = -ux;
        uy = -uy;
      }

  }

  // src/unicorn.js
  var GRAV = 1200;
  var RUN_MIN = 200;
  var RUN_MAX = 340;
  var SPD_CAP = 950;
  var HOOF_R = 14;
  var STEP_UP = 46;
  var LAUNCH_K = 0.9;
  var EV = { LAUNCH: 1, ARC: 2, DIRT: 4, ARCLOST: 8, STEPUP: 16 };
  var U = {
    x: 0,
    y: 0,
    vx: 0,
    vy: 0,
    speed: RUN_MIN,
    surf: "dirt",
    // 'dirt' | 'rainbow' | 'air'
    arc: null,
    arcD: 0,
    // 当前踩着的弧 + 弧长参数
    combo: 0,
    best: 0,
    sq: 1,
    sqv: 0,
    // squash & stretch（1 = 原形，<1 压扁，>1 拉长）
    rot: 0,
    phase: 0,
    spin: 0,
    air: 0,
    arcTime: 0,
    ev: 0,
    alive: true,
    dustT: 0,
    sparkT: 0
  };
  var runSpeed = () => RUN_MIN + min(1, W.dist / 9e3) * (RUN_MAX - RUN_MIN);
  function reset3() {
    const g = ginfo(W.startX);
    U.x = W.startX;
    U.y = g ? g.y : 470;
    U.speed = RUN_MIN;
    U.vx = RUN_MIN;
    U.vy = 0;
    U.surf = "dirt";
    U.arc = null;
    U.arcD = 0;
    U.combo = 0;
    U.best = 0;
    U.sq = 1;
    U.sqv = 0;
    U.rot = 0;
    U.phase = 0;
    U.spin = 0;
    U.air = 0;
    U.arcTime = 0;
    U.ev = 0;
    U.alive = true;
    U.dustT = 0;
    U.sparkT = 0;
  }
  function toAir() {
    if (U.surf === "air") return;
    U.surf = "air";
    U.arc = null;
    U.air = 0;
    U.ev |= EV.LAUNCH;
  }
  function onArc(s, fromAir) {
    U.surf = "rainbow";
    U.arc = s.arc;
    U.arcD = s.d;
    U.y = s.y;
    U.speed = clamp(max(U.speed, runSpeed() * 0.62), 0, SPD_CAP);
    U.vx = s.tx * U.speed;
    U.vy = s.ty * U.speed;
    U.sq = fromAir ? 0.58 : 0.82;
    U.sqv = 0;
    if (fromAir) {
      U.air = 0;
      U.combo++;
      if (U.combo > U.best) U.best = U.combo;
      U.ev |= EV.ARC;
      burst("spark", U.x, U.y, 14, 0, -50);
    } else {
      U.ev |= EV.STEPUP;
      burst("spark", U.x, U.y, 5, 0, -30);
    }
  }
  function onDirt(g, y) {
    const lost = U.combo > 0;
    U.surf = "dirt";
    U.arc = null;
    U.y = y;
    U.speed = max(U.speed * 0.88, runSpeed() * 0.72);
    const L = hypot(1, g.d1) || 1;
    U.vx = U.speed / L;
    U.vy = U.speed * g.d1 / L;
    U.sq = lost ? 0.5 : 0.72;
    U.sqv = 0;
    U.air = 0;
    U.combo = 0;
    U.ev |= EV.DIRT;
    burst("dust", U.x, U.y, lost ? 12 : 7, -U.vx * 0.22, -70);
  }
  function step(h) {
    const rs = runSpeed();
    const px = U.x, py = U.y;
    if (U.surf === "dirt") {
      const nx = px + U.vx * h;
      const g = ginfo(nx);
      if (!g) {
        toAir();
      } else {
        let dx = nx - px, dy = g.y - py;
        let L = hypot(dx, dy);
        if (L < 1e-6) {
          dx = 1;
          dy = 0;

    // 'title' | 'play' | 'gameover'
    t: 0,
    dt: 0,
    score: 0,
    best: 0,
    overT: 0,
    // 结算面板已展示时长（用于重开防误触）
    comboT: -9,
    // 上次连段提升时刻（UI 弹跳动画用）
    reason: "",
    // 'void' | 'spike'
    touch: false,
    // 是否触屏设备（提示文案分支）
    px: 0,
    // 上一帧独角兽 x（算距离增量→分数）
    deadX: 0,
    deadY: 0,
    // 死亡瞬间位置（结算时冻结摄像机）
    frame: 0,
    fps: 60
  };
  var cv2 = null;
  function loadBest() {
    try {
      const v = localStorage.getItem(BEST_KEY);
      G.best = v ? max(0, Number(v) || 0) : 0;
    } catch (e) {
      G.best = 0;
    }
  }
  function saveBest() {
    try {
      localStorage.setItem(BEST_KEY, String(floor(G.best)));
    } catch (e) {
    }
  }
  function start() {
    G.mode = "play";
    G.score = 0;
    G.overT = 0;
    G.reason = "";
    G.comboT = -9;
    reset(false);
    reset2();
    reset3();
    G.px = U.x;
    G.deadX = U.x;
    G.deadY = U.y;
    unlock();
    music(true);
    play("start");
  }
  function toTitle() {
    G.mode = "title";
    G.score = 0;
    G.overT = 0;
    reset(true);
    reset2();
    reset3();
    G.px = U.x;
    music(false);
    resetIntro();
  }
  function gameOver(reason) {
    if (G.mode !== "play") return;
    G.mode = "gameover";
    G.overT = 0;
    G.reason = reason;
    U.alive = false;
    G.deadX = U.x;
    G.deadY = U.y;
    const spike = reason === "spike";
    U.vx = spike ? -U.speed * 0.3 : U.vx * 0.45;
    U.vy = spike ? -430 : -40;
    U.spin = spike ? -9 : -2.4;
    U.surf = "air";
    U.arc = null;
    burst("boom", U.x, U.y - 24, 28, 0, -90);
    play(spike ? "spike" : "fall");
    music(false);
    if (G.score > G.best) {
      G.best = G.score;
      saveBest();
    }
  }
  function update4(dt) {
    if (G.mode === "play") {
      update3(dt);
      update2(dt);
      update(dt, U.x, U.y);
      const dx = U.x - G.px;
      G.px = U.x;
      if (dx > 0) G.score += dx * 0.1 * mult();
      const got = collectDust(U.x, U.y - 22, HOOF_R + 8);
      for (let i = 0; i < got.length; i++) {
        const d = got[i];
        G.score += 50 * mult();
        addInk(20);
        burst("star", d.x, d.y, 12);
        play("star", 1 + min(0.55, U.combo * 0.07));
      }
      const ev = U.ev;
      if (ev & EV.ARC) {
        G.comboT = G.t;
        play("combo", pow(1.09, min(12, U.combo)));
      } else if (ev & EV.STEPUP) {
        play("land", 1, 0.05);
      }
      if (ev & EV.DIRT) play("thud", 1, 0.05);
      if (ev & EV.LAUNCH) play("jump", 1, 0.09);
      if (ev & EV.ARCLOST) play("cast", 0.8, 0.06);
      const dead = checkDeath();
      if (dead) gameOver(dead);
    } else if (G.mode === "title") {
      update3(dt);
      update2(dt);
      update(dt, U.x, U.y);
      if (U.y > deathY()) {
        U.y = W.cam.gy - 10;
        U.vy = 0;
        U.surf = "air";
      }
    } else {
      G.overT += dt;
      U.vy += GRAV * dt;
      U.x += U.vx * dt;
      U.y += U.vy * dt;
      U.rot += U.spin * dt;
      update2(dt);
      update(dt, G.deadX, G.deadY);
    }
  }
  function ptrDown(e) {
    G.touch = e.pointerType !== "mouse";
    unlock();
    if (G.mode === "title") {
      start();
      return;
    }
    if (G.mode === "gameover") {
      if (G.overT > 0.55) start();
      return;
    }
    if (e.preventDefault) e.preventDefault();
    down(wx(e.clientX), wy(e.clientY));
    if (RB.cur) play("draw", 1, 0.12);
    else play("empty", 1, 0.3);
    if (cv2.setPointerCapture && e.pointerId !== void 0) {
      try {
        cv2.setPointerCapture(e.pointerId);
      } catch (err) {
      }
    }
  }
  function ptrMove(e) {
    if (G.mode !== "play" || !RB.drawing) return;
    if (move(wx(e.clientX), wy(e.clientY))) play("draw", 1, 0.09);
  }
  function ptrUp(e) {
    if (G.mode !== "play" || !RB.drawing) return;
    const a = up();
    if (a) play("cast");
    if (e && e.pointerId !== void 0 && cv2.releasePointerCapture) {
      try {
        cv2.releasePointerCapture(e.pointerId);
      } catch (err) {
      }
    }
  }
  function keyDown(e) {
    const c = e.code;
    if (c === "Space" || c === "Enter" || c === "NumpadEnter") {
      e.preventDefault();
      if (G.mode === "title") start();
      else if (G.mode === "gameover" && G.overT > 0.55) start();
    } else if (c === "KeyM") {
      AX.muted = !AX.muted;
      mute(AX.muted);
    } else if (c === "KeyR" && G.mode !== "title") {
      start();
    }
  }
  function onResize() {
    const s = resize2();
    resize(s.w, s.h);
  }
  var last2 = 0;
  var fpsAcc = 0;
  var fpsN = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (!last2) last2 = now;
    const dt = clamp((now - last2) / 1e3, 0, 0.05);
    last2 = now;
    G.dt = dt;
    G.t += dt;
    G.frame++;
    fpsAcc += dt;
    fpsN++;
    if (fpsAcc >= 0.5) {
      G.fps = fpsN / fpsAcc;
      fpsAcc = 0;
      fpsN = 0;
    }
    update4(dt);
    draw(G);
  }
  function boot() {
    cv2 = document.getElementById("game");
    init(cv2);
    onResize();
    loadBest();
    cv2.addEventListener("pointerdown", ptrDown);
    window.addEventListener("pointermove", ptrMove, { passive: true });
    window.addEventListener("pointerup", ptrUp);
    window.addEventListener("pointercancel", ptrUp);
    window.addEventListener("keydown", keyDown);
    window.addEventListener("resize", onResize);
    window.addEventListener("orientationchange", onResize);
    cv2.addEventListener("contextmenu", (e) => e.preventDefault());
    document.addEventListener("gesturestart", (e) => e.preventDefault());
    toTitle();
    requestAnimationFrame(frame);
  }
  if (document.getElementById("game")) boot();
  else window.addEventListener("DOMContentLoaded", boot);
  window.__rb = {
    G,
    U,
    W,
    RB,
    EV,
    INK_MAX,
    version: "0.1.0",
    start,
    toTitle,
    gameOver,
    runSpeed,
    mult,
    deathY,
    /** 供验证脚本在世界坐标下画一条彩虹 */
    paint(x0, y0, x1, y1, steps) {
      const n = max(2, steps || 24);
      down(x0, y0);
      for (let i = 1; i <= n; i++) {
        const k = i / n;
        move(x0 + (x1 - x0) * k, y0 + (y1 - y0) * k);
      }
      return up();
    },
    /** 直接注入彩虹墨（测试用） */
    ink: (v) => {
      RB.ink = clamp(v, 0, INK_MAX);
    },
    stats: () => ({
      mode: G.mode,
      score: G.score,
      best: G.best,
      dist: W.dist,
      combo: U.combo,
      bestCombo: U.best,
      surf: U.surf,
      speed: U.speed,
      x: U.x,
      y: U.y,
      ink: RB.ink,
      arcs: RB.arcs.length,
      dust: W.dust.length,
      spikes: W.spikes.length,
      fx: W.fx.length,
      ground: W.ground.size,
      fps: G.fps,
      frame: G.frame,
      muted: AX.muted
    })
  };
})();
</script>
</body>
</html>
